<script>
    // --- Loading screen ---
    window.addEventListener('DOMContentLoaded', () => {
      const loader = document.getElementById('loader');
      const loaderText = document.getElementById('loader-word');
      const loadingWord = 'joag';
      const keyDelays = [77, 228, 231];

      let loadingIndex = 0;

      function typeJoag() {
        loaderText.textContent = loadingWord.slice(0, ++loadingIndex);

        if (loadingIndex < loadingWord.length) {
          setTimeout(typeJoag, keyDelays[loadingIndex - 1]);
        } else {
          setTimeout(() => {
            loader.classList.add('loaded');
          }, 350);
        }
      }

      typeJoag();
    });

  try { if (localStorage.getItem('darkness') === '1') document.documentElement.classList.add('darkness'); } catch (e) {}
</script>

  <script>
    // Large phone photos (often 3000-4000px wide) are expensive to
    // scale/blur every animation frame. Once each image loads, redraw
    // it onto a canvas at a sane max size and swap the <img> to that —
    // a one-time cost that makes every subsequent frame much cheaper.
    function downscaleImage(img) {
      const MAX_DIM = 1400;
      const run = () => {
        const w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h || Math.max(w, h) <= MAX_DIM) return; // already small enough
        const scale = MAX_DIM / Math.max(w, h);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(w * scale);
        canvas.height = Math.round(h * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((blob) => {
          if (blob) img.src = URL.createObjectURL(blob);
        }, 'image/jpeg', 0.85);
      };
      if (img.complete) run();
      else img.addEventListener('load', run, { once: true });
    }
    document.querySelectorAll('.slide img').forEach(downscaleImage);

    // GitHub Pages serves filenames case-sensitively. Keep the intended path
    // first, but automatically try common capitalization variants for the two
    // images that can differ between Windows and the deployed repository.
    const imageFallbacks = {
      'photos/IMG_3579.JPG': [
        'photos/IMG_3579.jpg',
        'photos/img_3579.JPG',
        'photos/img_3579.jpg'
      ],
      'photos/DSC_0062_Original.jpg': [
        'photos/DSC_0062_Original.JPG',
        'photos/DSC_0062_original.jpg',
        'photos/DSC_0062_original.JPG',
        'photos/dsc_0062_original.jpg',
        'photos/dsc_0062_original.JPG'
      ]
    };

    document.querySelectorAll('.slide img').forEach((img) => {
      const original = img.getAttribute('src');
      const candidates = imageFallbacks[original];
      if (!candidates) return;

      let attempt = 0;
      img.addEventListener('error', function tryFallback() {
        if (attempt >= candidates.length) return;
        img.src = candidates[attempt++];
      });
    });

    let slides = Array.from(document.querySelectorAll('.slide'));

    // Randomize the photo order once when the site launches.
    // Fisher-Yates produces an unbiased shuffle.
    for (let i = slides.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [slides[i], slides[j]] = [slides[j], slides[i]];
    }

    const total = slides.length;

    // "position" is a continuous, fractional value (e.g. 3.4 means
    // 40% of the way from slide 3 to slide 4). Every frame, position
    // eases toward targetPosition instead of jumping — that easing,
    // happening continuously rather than as a one-shot CSS transition,
    // is what makes the motion feel like a single fluid gesture.
    let position = 0;
    let targetPosition = 0;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Smooth easing with no spring/overshoot. This keeps the glide fluid
    // on phones without the "bounce into place" effect.
    const EASE = reduceMotion ? 1 : 0.095;

    // Shortest wrapped distance from `a` to `b` on a circular track of length `total`
    function wrappedDelta(a, b) {
      let d = (b - a) % total;
      if (d > total / 2) d -= total;
      if (d < -total / 2) d += total;
      return d;
    }

    function wrap(n) {
      return ((n % total) + total) % total;
    }

    // The carousel uses a true overlapping stack:
    // the top edge of each following image begins halfway down
    // the image in front of it. Five images are kept visible in
    // each direction and all background images stay fully opaque.
    function stackScale(abs) {
      return Math.max(0.50, 1 - 0.10 * abs);
    }

    function thumbHeight(index) {
      const thumb = slides[index]?.querySelector('.thumb');
      return thumb ? thumb.offsetHeight : 0;
    }

    function stackOffsetForInteger(activeIndex, relativeIndex) {
      // Returns the TOP position of a card relative to the center of
      // the active card. A positive relativeIndex moves downward.
      const activeHeight = thumbHeight(activeIndex) * stackScale(0);
      let top = -activeHeight / 2;

      if (relativeIndex > 0) {
        for (let n = 1; n <= relativeIndex; n++) {
          const previousIndex = wrap(activeIndex + n - 1);
          const previousHeight =
            thumbHeight(previousIndex) * stackScale(n - 1);
          top += previousHeight / 2;
        }
      } else if (relativeIndex < 0) {
        for (let n = -1; n >= relativeIndex; n--) {
          const previousIndex = wrap(activeIndex + n);
          const previousHeight =
            thumbHeight(previousIndex) * stackScale(Math.abs(n));
          top -= previousHeight / 2;
        }
      }

      return top;
    }

    function stackTopForDiff(activeIndex, diff) {
      const maxStack = 5;
      const clamped = Math.max(-maxStack, Math.min(maxStack, diff));

      if (Math.abs(clamped) < 0.0001) {
        return stackOffsetForInteger(activeIndex, 0);
      }

      const direction = clamped > 0 ? 1 : -1;
      const distance = Math.abs(clamped);
      const lower = Math.floor(distance);
      const fraction = distance - lower;

      const a = direction * lower;
      const b = direction * Math.min(lower + 1, maxStack);

      const topA = stackOffsetForInteger(activeIndex, a);
      const topB = stackOffsetForInteger(activeIndex, b);

      return topA + (topB - topA) * fraction;
    }

    function styleSlide(slide, diff) {
      const abs = Math.abs(diff);

      // Keep the current image plus the next five stacked images
      // visible. The previous five remain above the current image
      // so the carousel can loop continuously in either direction.
      if (abs > 5.15) {
        slide.style.display = 'none';
        return;
      }

      slide.style.display = '';

      const scale = stackScale(abs);

      slide.dataset.scale = scale;

      // Keep the soft blur on the stacked photos behind the active image.
      // Photos below the active image stay fully opaque; photos above it
      // gradually fade away as they move out of view.
      const blur = Math.min(abs * 4, 7);
      slide.style.filter = `blur(${blur}px)`;

      if (diff < 0) {
        // Images above the active photo fade smoothly into nothing.
        const fade = Math.max(0, 1 - abs / 1.8);
        slide.style.opacity = String(fade);
      } else {
        // Images below the active photo remain opaque.
        slide.style.opacity = '1';
      }

      slide.style.transformOrigin = 'center center';

      // The active image sits above every card behind it.
      slide.style.zIndex = String(20 - Math.round(abs));
    }

    function render() {
      const centerY = carouselEl.clientHeight / 2;
      const activeIndex = wrap(Math.round(position));

      slides.forEach((slide, i) => {
        const diff = wrappedDelta(position, i);
        styleSlide(slide, diff);

        if (Math.abs(diff) <= 5.15) {
          const scale = parseFloat(slide.dataset.scale || 1);
          const topOffset = stackTopForDiff(activeIndex, diff);

          // Position from the TOP of the card rather than its center.
          // This makes the next image begin halfway down the current one.
          slide.style.top = `${centerY + topOffset}px`;
          slide.style.transform =
            `translate3d(-50%, 0, 0) scale(${scale})`;
        }
      });

      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === activeIndex);
      });
    }

    function tick() {
      const delta = wrappedDelta(position, targetPosition);

      // Ease directly toward the target. Unlike a spring, this never
      // overshoots the destination, so slides settle cleanly on mobile.
      if (!reduceMotion) {
        if (Math.abs(delta) < 0.0004) {
          position = targetPosition;
        } else {
          position = wrap(position + delta * EASE);
        }
      } else {
        position = targetPosition;
      }

      render();
      requestAnimationFrame(tick);
    }

    // --- Input handling: all inputs just move targetPosition.
    // The animation loop above handles turning that into smooth motion. ---

    let settleTimer = null;
    function scheduleSettle() {
      clearTimeout(settleTimer);
      settleTimer = setTimeout(() => {
        // Once scrolling pauses, snap the target to the nearest whole
        // slide so it comes to rest centered rather than mid-way.
        targetPosition = wrap(Math.round(targetPosition));
      }, 90);
    }

    const carouselEl = document.getElementById('carousel');

    // --- Automatic slideshow ---
    // Advance every 2.5 seconds. There is no pause control; hovering over a
    // photo never pauses the slideshow.
    const AUTOPLAY_DELAY = 2500;
    const autoplayPaused = false;
    let autoplayTimer = null;

    function resetAutoplay() {
      clearTimeout(autoplayTimer);
      if (autoplayPaused) return;

      autoplayTimer = setTimeout(() => {
        targetPosition += 1;
        scheduleSettle();
        resetAutoplay();
      }, AUTOPLAY_DELAY);
    }

    // --- Darkness mode ---
    // Moon icon = "go dark", sun icon = "bring the background back".
    const darkToggle = document.getElementById('darkToggle');
    const darkToggleIcon = document.getElementById('darkToggleIcon');
    const rootEl = document.documentElement;

    function updateDarkButton() {
      const on = rootEl.classList.contains('darkness');
      darkToggleIcon.src = on ? 'assets/sun-chrome.png' : 'assets/moon-chrome.png';
      const label = on ? 'Turn off darkness mode' : 'Turn on darkness mode';
      darkToggle.setAttribute('aria-label', label);
      darkToggle.setAttribute('title', label);
      darkToggle.setAttribute('aria-pressed', String(on));
    }

    function updateBrowserThemeColor() {
      const themeColor = document.getElementById('theme-color-meta');
      if (themeColor) {
        themeColor.content = rootEl.classList.contains('darkness')
          ? '#000000'
          : '#f7f3e8';
      }
    }

    darkToggle.addEventListener('click', () => {
      const on = rootEl.classList.toggle('darkness');
      updateBrowserThemeColor();
      try { localStorage.setItem('darkness', on ? '1' : '0'); } catch (e) {}
      updateDarkButton();
    });

    updateBrowserThemeColor();

    updateDarkButton();

    // Mouse wheel / trackpad — deltaY is added straight into a
    // continuous target, so a light scroll nudges partway and a firm
    // scroll carries further, just like Apple's scroll-driven pages.
    carouselEl.addEventListener('wheel', (e) => {
      e.preventDefault();
      targetPosition = targetPosition + e.deltaY * 0.0030;
      scheduleSettle();
      resetAutoplay();
    }, { passive: false });

    // Keyboard: nudge target by a whole slide; the loop eases into it
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') {
        targetPosition += 1;
        scheduleSettle();
        resetAutoplay();
      }
      if (e.key === 'ArrowUp') {
        targetPosition -= 1;
        scheduleSettle();
        resetAutoplay();
      }
    });

    // Touch swipe — drag directly maps to fractional position for a
    // 1:1 "follow your finger" feel, then eases/snaps on release
    let touchStartY = null;
    let touchStartTarget = 0;
    carouselEl.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
      touchStartTarget = targetPosition;
      clearTimeout(autoplayTimer);
    }, { passive: true });
    carouselEl.addEventListener('touchmove', (e) => {
      if (touchStartY === null) return;
      const delta = touchStartY - e.touches[0].clientY;
      targetPosition = touchStartTarget + delta * 0.0065;
    }, { passive: true });
    carouselEl.addEventListener('touchend', () => {
      touchStartY = null;
      scheduleSettle();
      resetAutoplay();
    });

    render();
    requestAnimationFrame(tick);
    resetAutoplay();
  </script>

</body>
</html>
