<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jack gomes</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --text: #f0ece2;    /* light cream, for contrast against the dark image */
    --muted: #b7b0a1;
    --accent: #ffffff;
    --line: #4a473f;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: var(--font);
    background-color: #000000;
    background-image: url('assets/background.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow: hidden; /* the carousel manages its own scrolling */
    text-transform: lowercase; /* renders everything on the page in lowercase */
  }

  header {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2.25rem 1.5rem 0.5rem;
  }

  header h1 {
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  header p {
    color: var(--muted);
    margin-top: 0.3rem;
    font-size: 0.95rem;
  }

  /* ---- Vertical carousel ---- */
  .carousel {
    position: relative;
    height: calc(100vh - 6rem);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .slide {
    position: absolute;
    width: min(760px, 92vw);
    text-align: center;
    transition: transform 1.1s cubic-bezier(0.45, 0, 0.15, 1),
                opacity 1.1s cubic-bezier(0.45, 0, 0.15, 1),
                filter 1.1s cubic-bezier(0.45, 0, 0.15, 1);
    pointer-events: none;
    will-change: transform, opacity, filter;
    /* Perf: isolate each slide into its own compositor layer so
       animating transform/opacity/filter doesn't trigger repaints
       of the whole page — this is what actually makes the motion smooth. */
    backface-visibility: hidden;
    transform-style: preserve-3d;
    contain: layout style;
  }

  /*
    The photo box now sizes itself to the image's own aspect ratio
    (capped by max-width/max-height) instead of forcing a fixed 4:3
    crop. object-fit: contain means the ENTIRE photo is always visible,
    letterboxed if needed, no matter what resolution or orientation
    it was shot in.
  */
  .slide .thumb {
    display: inline-block;
    line-height: 0; /* removes the tiny gap inline-block adds under images */
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    border: 4px solid #ffffff; /* slim white border around every photo */
    background: rgba(0, 0, 0, 0.25); /* fills any letterboxed space */
  }

  .slide .thumb img {
    display: block;
    max-width: 100%;
    max-height: 62vh;
    width: auto;
    height: auto;
    object-fit: contain;
  }

  .slide .caption {
    margin-top: 0.9rem;
  }

  .slide .date {
    font-size: 0.78rem;
    color: var(--muted);
    display: block;
    margin-bottom: 0.2rem;
  }

  .slide .title {
    font-size: 1.15rem;
    font-weight: 600;
  }

  /* Position states, applied by JS based on distance from the active slide */
  .slide.active {
    transform: translateY(0) scale(1);
    opacity: 1;
    filter: blur(0px);
    z-index: 3;
    pointer-events: auto;
  }

  .slide.prev {
    transform: translateY(-68%) scale(0.5);
    opacity: 0.3;
    filter: blur(2px);
    z-index: 2;
  }

  .slide.next {
    transform: translateY(68%) scale(0.5);
    opacity: 0.3;
    filter: blur(2px);
    z-index: 2;
  }

  .slide.far {
    transform: translateY(0) scale(0.4);
    opacity: 0;
    filter: blur(4px);
    z-index: 1;
  }

  .carousel-hint {
    position: relative;
    z-index: 2;
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    padding-bottom: 1rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .slide {
      transition: none;
    }
  }
</style>
</head>
<body>

  <!--
    HOW THIS CAROUSEL WORKS:
    - Each .slide is one photo post. Duplicate a .slide block to add more.
    - JS below tracks a "current index" and gives every slide a class
      (active / prev / next / far) based on how far it is from that index.
      The CSS above turns those classes into position, size, and fade.
    - Scroll the mouse wheel, swipe on mobile, or use the Up/Down arrow
      keys to move through the photos. It loops endlessly in both directions.

    IMPORTANT FOR SMOOTHNESS: phone photos straight from the camera are
    often 3-12MB at full resolution. Scaling/blurring a file that large
    during an animation is genuinely heavy work for the browser, no
    matter how good the CSS is. For best results, resize each photo so
    its longest side is around 2000px and export at ~80% JPEG quality
    before uploading (Preview on Mac, or squoosh.app, do this in seconds).
    That alone fixes most "laggy transition" issues.
  -->

  <header>

    <div class="slide" data-title="Photo 12">
      <div class="thumb">
        <img src="photos/img_9999.png" alt="Photo 12" decoding="async">

      </div>
    </div>

  </div>

  <p class="carousel-hint">Scroll, swipe, or use ↑ / ↓ to browse</p>

  <script>
    const slides = Array.from(document.querySelectorAll('.slide'));
    const total = slides.length;
    let current = 0;
    let isAnimating = false;

    function render() {
      slides.forEach((slide, i) => {
        let diff = i - current;
        if (diff > total / 2) diff -= total;
        if (diff < -total / 2) diff += total;

        slide.classList.remove('active', 'prev', 'next', 'far');
        if (diff === 0) slide.classList.add('active');
        else if (diff === -1) slide.classList.add('prev');
        else if (diff === 1) slide.classList.add('next');
        else slide.classList.add('far');
      });
    }

    function go(direction) {
      if (isAnimating) return;
      isAnimating = true;
      current = (current + direction + total) % total;
      render();
      setTimeout(() => { isAnimating = false; }, 1100);
    }

    let wheelCooldown = false;
    document.getElementById('carousel').addEventListener('wheel', (e) => {
      e.preventDefault();
      if (wheelCooldown) return;
      if (Math.abs(e.deltaY) < 8) return;
      wheelCooldown = true;
      go(e.deltaY > 0 ? 1 : -1);
      setTimeout(() => { wheelCooldown = false; }, 1100);
    }, { passive: false });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') go(1);
      if (e.key === 'ArrowUp') go(-1);
    });

    let touchStartY = null;
    const carouselEl = document.getElementById('carousel');
    carouselEl.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    carouselEl.addEventListener('touchend', (e) => {
      if (touchStartY === null) return;
      const delta = touchStartY - e.changedTouches[0].clientY;
      if (Math.abs(delta) > 40) go(delta > 0 ? 1 : -1);
      touchStartY = null;
    });

    render();
  </script>

</body>
