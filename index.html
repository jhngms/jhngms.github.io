  }

    overflow: hidden; /* the carousel manages its own scrolling */

  /* ---- Wavy black top banner ---- */
  .top-banner {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 150px;
    background: linear-gradient(
      to bottom,

  }

  .banner-wave {
    position: absolute;
    left: 0;
    bottom: -1px;
    width: 100%;
    height: 55px;
    display: block;
  }

  /* ---- Exact top ribbon styling ---- */
  .top-banner {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 150px;
    background: linear-gradient(
      to bottom,
      rgba(63, 54, 43, 0) 0%,

    z-index: 10;
    pointer-events: none;

  .site-title {
    position: fixed; top: 2rem; left: 50%; transform: translate(-50%, -50%);
    z-index: 21; color: #f0ece2; font-size: 1.6rem; font-weight: 600;
    letter-spacing: -0.01em; white-space: nowrap; text-align: center; pointer-events: none;
  }

  .site-nav {
    position: fixed; top: 2.25rem; left: 1rem; transform: translateY(-50%);
    z-index: 20; display: flex; align-items: center; gap: .15rem;
  }

  .site-nav a {
    width: 54px; height: 54px; padding: 0; border: 0; background: transparent;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    line-height: 0; text-decoration: none; transition: transform .2s ease, opacity .2s ease;
  }

  .site-nav a img { display: block; width: 31px; height: 31px; object-fit: contain; pointer-events: none; }
  .site-nav a:hover { transform: scale(1.05); opacity: 1; }
  .site-nav a:focus-visible { outline: 1px solid rgba(255,255,255,.8); outline-offset: 5px; }

  .play-toggle {
    position: fixed; top: 2.25rem; right: 1rem; transform: translateY(-50%);
    z-index: 20; width: 54px; height: 54px; padding: 0; border: 0; background: transparent;
    display: flex; align-items: center; justify-content: center; cursor: pointer; line-height: 0;
    transition: transform .2s ease, opacity .2s ease;
  }

  .play-toggle img { display: block; width: 31px; height: 31px; object-fit: contain; pointer-events: none; }
  .play-toggle:hover { transform: translateY(-50%) scale(1.05); opacity: 1; }
  .play-toggle:focus-visible { outline: 1px solid rgba(255,255,255,.8); outline-offset: 5px; }

  /* ---- Vertical carousel ---- */
  .carousel {
    position: relative;
    height: calc(100vh - 6rem);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transform: translateY(70px);
  }

  .slide {
    position: absolute;
    width: min(760px, 92vw);
    text-align: center;
    /* No CSS transition here on purpose — the JS animation loop below
       sets transform/opacity/filter every frame, continuously easing
       toward the scroll position. That's what makes it feel fluid
       instead of "jump then animate." */
    pointer-events: none;
    will-change: transform, opacity, filter;
    backface-visibility: hidden;
    contain: layout style;
  }

  /*
    The photo box now sizes itself to the image's own aspect ratio
    (capped by max-width/max-height) instead of forcing a fixed 4:3
    crop. object-fit: contain means the ENTIRE photo is always visible,
    letterboxed if needed, no matter what resolution or orientation
    it was shot in.
  */
  .slide .thumb {
    display: inline-flex;
    flex-direction: column;
    width: max-content;
    max-width: 100%;
    line-height: 0;
    border-radius: 0;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    border: 4px solid rgb(247, 243, 232);
    background: rgb(247, 243, 232);
  }

  .slide .thumb img {
    display: block;
    max-width: 100%;
    max-height: 62vh;
    width: auto;
    height: auto;
    object-fit: contain;
  }

  /* The white card continues naturally below each image. Its width is
     determined by the rendered image, so portrait and landscape photos
     each get a correctly sized caption area. */
  .slide .caption {
    width: 100%;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.7rem 0.9rem 0.75rem;
    background: rgb(247, 243, 232) !important;
    color-scheme: light;
    line-height: 1.15;
    text-align: initial;
  }

  .slide .title {
    font-size: 0.95rem;
    font-weight: 600;
    color: #4a2f24;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .slide .date {
    order: 2;
    flex: 0 0 auto;
    font-size: 0.82rem;
    font-weight: 500;
    color: #4a2f24;
    text-align: right;
    white-space: nowrap;
  }

  /* active class is still used to toggle pointer-events / a11y,
     but position, scale, opacity, and blur are all set continuously
     by JS every animation frame instead of jumping between fixed states. */
  .slide.active {
    pointer-events: auto;
  }

  .carousel-hint {
    position: relative;
    z-index: 2;
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    padding-bottom: 1rem;
  }



  /* Keep the photo border and info card the exact same cream in dark mode. */
  @media (prefers-color-scheme: dark) {
    .slide .thumb,
    .slide .caption {
      background-color: rgb(247, 243, 232) !important;
      border-color: rgb(247, 243, 232) !important;
      color-scheme: light !important;
    }

    .slide .title,
    .slide .date {
      color: #4a2f24 !important;
    }
  }

</style>

<body>

  <!--
    HOW THIS CAROUSEL WORKS:
    - Each .slide is one photo post. Duplicate a .slide block to add more.

  -->

  <script>
    // Large phone photos (often 3000-4000px wide) are expensive to
    // scale/blur every animation frame. Once each image loads, redraw
    // it onto a canvas at a sane max size and swap the <img> to that —
    // a one-time cost that makes every subsequent frame much cheaper.
    function downscaleImage(img) {
      const MAX_DIM = 1400;
      const run = () => {
        const w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h || Math.max(w, h) <= MAX_DIM) return; // already small enough
        const scale = MAX_DIM / Math.max(w, h);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(w * scale);
        canvas.height = Math.round(h * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((blob) => {
          if (blob) img.src = URL.createObjectURL(blob);
        }, 'image/jpeg', 0.85);
      };
      if (img.complete) run();
      else img.addEventListener('load', run, { once: true });
    }
    document.querySelectorAll('.slide img').forEach(downscaleImage);

    // GitHub Pages serves filenames case-sensitively. Keep the intended path
    // first, but automatically try common capitalization variants for the two
    // images that can differ between Windows and the deployed repository.
    const imageFallbacks = {
      'photos/IMG_3579.JPG': [
        'photos/IMG_3579.jpg',
        'photos/img_3579.JPG',
        'photos/img_3579.jpg'
      ],
      'photos/DSC_0062_Original.jpg': [
        'photos/DSC_0062_Original.JPG',
        'photos/DSC_0062_original.jpg',
        'photos/DSC_0062_original.JPG',
        'photos/dsc_0062_original.jpg',
        'photos/dsc_0062_original.JPG'
      ]
    };

    document.querySelectorAll('.slide img').forEach((img) => {
      const original = img.getAttribute('src');
      const candidates = imageFallbacks[original];
      if (!candidates) return;

      let attempt = 0;
      img.addEventListener('error', function tryFallback() {
        if (attempt >= candidates.length) return;
        img.src = candidates[attempt++];
      });
    });

    let slides = Array.from(document.querySelectorAll('.slide'));

    // Randomize the photo order once when the site launches.
    // Fisher-Yates produces an unbiased shuffle.
    for (let i = slides.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [slides[i], slides[j]] = [slides[j], slides[i]];
    }

    const total = slides.length;

    // "position" is a continuous, fractional value (e.g. 3.4 means
    // 40% of the way from slide 3 to slide 4). Every frame, position
    // eases toward targetPosition instead of jumping — that easing,
    // happening continuously rather than as a one-shot CSS transition,
    // is what makes the motion feel like a single fluid gesture.
    let position = 0;
    let targetPosition = 0;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Smooth easing with no spring/overshoot. This keeps the glide fluid
    // on phones without the "bounce into place" effect.
    const EASE = reduceMotion ? 1 : 0.12;

    // Shortest wrapped distance from `a` to `b` on a circular track of length `total`
    function wrappedDelta(a, b) {
      let d = (b - a) % total;
      if (d > total / 2) d -= total;
      if (d < -total / 2) d += total;
      return d;
    }

    function wrap(n) {
      return ((n % total) + total) % total;
    }

    function styleSlide(slide, diff) {
      const abs = Math.min(Math.abs(diff), 2);

      // Slides more than ~2.4 steps away are fully invisible anyway —
      // remove them from rendering entirely instead of still animating
      // filter/transform on them every frame. This cuts the number of
      // elements the browser has to composite+blur each frame roughly
      // in half on a 12-photo carousel.
      if (Math.abs(diff) > 2.4) {
        slide.style.display = 'none';
        return;
      }
      slide.style.display = '';

      const scale = abs <= 1 ? 1 - 0.5 * abs : 0.5 - 0.1 * (abs - 1);
      const opacity = abs <= 1 ? 1 - 0.7 * abs : Math.max(0, 0.3 * (2 - abs));
      // Keep the animation on transform + opacity only. Blur is visually nice,
      // but continuously blurring multiple large photos can make scrolling hitch.
      const translateY = diff * 68;

      slide.style.transform = `translate3d(0, ${translateY}%, 0) scale(${scale})`;
      slide.style.opacity = opacity;
      slide.style.filter = 'none';
      slide.style.zIndex = abs < 0.5 ? 3 : abs < 1.5 ? 2 : 1;
    }

    function render() {
      slides.forEach((slide, i) => {
        const diff = wrappedDelta(position, i);
        styleSlide(slide, diff);
      });
      // Mark whichever slide is nearest to center as interactive/active
      const nearestIndex = wrap(Math.round(position));
      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === nearestIndex);
      });
    }

    function tick() {
      const delta = wrappedDelta(position, targetPosition);

      // Ease directly toward the target. Unlike a spring, this never
      // overshoots the destination, so slides settle cleanly on mobile.
      if (!reduceMotion) {
        if (Math.abs(delta) < 0.0004) {
          position = targetPosition;
        } else {
          position = wrap(position + delta * EASE);
        }
      } else {
        position = targetPosition;
      }

      render();
      requestAnimationFrame(tick);
    }

    // --- Input handling: all inputs just move targetPosition.
    // The animation loop above handles turning that into smooth motion. ---

    let settleTimer = null;
    function scheduleSettle() {
      clearTimeout(settleTimer);
      settleTimer = setTimeout(() => {
        // Once scrolling pauses, snap the target to the nearest whole
        // slide so it comes to rest centered rather than mid-way.
        targetPosition = wrap(Math.round(targetPosition));
      }, 90);
    }

    const carouselEl = document.getElementById('carousel');

    // --- Automatic slideshow ---
    // Advance every 2.5 seconds. Playback is controlled only by the button
    // in the top-right; hovering over a photo never pauses the slideshow.
    const AUTOPLAY_DELAY = 2500;
    let autoplayPaused = false;
    let autoplayTimer = null;

    const playToggle = document.getElementById('playToggle');
    const playToggleIcon = document.getElementById('playToggleIcon');

    function updatePlayButton() {
      if (autoplayPaused) {
        playToggleIcon.src = 'assets/play-chrome.png';
        playToggle.setAttribute('aria-label', 'Play slideshow');
        playToggle.setAttribute('title', 'Play slideshow');
      } else {
        playToggleIcon.src = 'assets/pause-chrome.png';
        playToggle.setAttribute('aria-label', 'Pause slideshow');
        playToggle.setAttribute('title', 'Pause slideshow');
      }
    }

    function resetAutoplay() {
      clearTimeout(autoplayTimer);
      if (autoplayPaused) return;

      autoplayTimer = setTimeout(() => {
        targetPosition += 1;
        scheduleSettle();
        resetAutoplay();
      }, AUTOPLAY_DELAY);
    }

    playToggle.addEventListener('click', () => {
      autoplayPaused = !autoplayPaused;
      if (autoplayPaused) {
        clearTimeout(autoplayTimer);
      } else {
        resetAutoplay();
      }
      updatePlayButton();
    });

    updatePlayButton();

    // Mouse wheel / trackpad — deltaY is added straight into a
    // continuous target, so a light scroll nudges partway and a firm
    // scroll carries further, just like Apple's scroll-driven pages.
    carouselEl.addEventListener('wheel', (e) => {
      e.preventDefault();
      targetPosition = targetPosition + e.deltaY * 0.0030;
      scheduleSettle();
      resetAutoplay();
    }, { passive: false });

    // Keyboard: nudge target by a whole slide; the loop eases into it
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') {
        targetPosition += 1;
        scheduleSettle();
        resetAutoplay();
      }
      if (e.key === 'ArrowUp') {
        targetPosition -= 1;
        scheduleSettle();
        resetAutoplay();
      }
    });

    // Touch swipe — drag directly maps to fractional position for a
    // 1:1 "follow your finger" feel, then eases/snaps on release
    let touchStartY = null;
    let touchStartTarget = 0;
    carouselEl.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
      touchStartTarget = targetPosition;
      clearTimeout(autoplayTimer);
    }, { passive: true });
    carouselEl.addEventListener('touchmove', (e) => {
      if (touchStartY === null) return;
      const delta = touchStartY - e.touches[0].clientY;
      targetPosition = touchStartTarget + delta * 0.0065;
    }, { passive: true });
    carouselEl.addEventListener('touchend', () => {
      touchStartY = null;
      scheduleSettle();
      resetAutoplay();
    });

    render();
    requestAnimationFrame(tick);
    resetAutoplay();
  </script>

</body>
